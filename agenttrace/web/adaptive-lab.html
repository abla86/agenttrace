<!doctype html><meta charset=utf-8><title>AgentTrace Adaptive Security Lab</title><style>body{font:16px system-ui;background:#0b1020;color:#eee;padding:24px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:18px;background:#17213a;border-radius:12px;border:1px solid #334363}#graph{height:320px;margin-top:18px;background:#070c18;position:relative;overflow:hidden;border-radius:12px}.node{position:absolute;padding:10px;border:1px solid #e06c75;border-radius:8px;background:#202c48}table{width:100%;margin-top:18px;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334363;text-align:left}</style><main><h1>AgentTrace Adaptive Security Lab</h1><div class=grid><div class=card><b id=t>0</b><br>scenarios</div><div class=card><b id=b>0</b><br>blocked</div><div class=card><b id=s>0%</b><br>attack success</div></div><div id=graph></div><table><thead><tr><th>Step</th><th>Attack</th><th>Mutation</th><th>Decision</th><th>Reason</th></tr></thead><tbody id=rows></tbody></table><script>const demo={total:5,blocked:4,attack_success_rate_pct:20,events:[{step:1,attack_type:'INDIRECT_INJECTION',mutation:'multi_step',decision:'BLOCK',reason:'UNTRUSTED_DATA_CANNOT_AUTHORIZE_ACTION'},{step:2,attack_type:'TOOL_POISONING',mutation:'tool_drift',decision:'BLOCK',reason:'TOOL_MANIFEST_INVALID'},{step:3,attack_type:'PRIVILEGE_ESCALATION',mutation:'role_shift',decision:'BLOCK',reason:'PHASE_CAPABILITY_DENIED'},{step:4,attack_type:'SECRET_EXFILTRATION',mutation:'direct',decision:'BLOCK',reason:'SECRET_CANNOT_FLOW_TO_NETWORK'},{step:5,attack_type:'INDIRECT_INJECTION',mutation:'direct',decision:'ALLOW',reason:'AUTHORIZED'}]};function render(d){t.textContent=d.total;b.textContent=d.blocked;s.textContent=d.attack_success_rate_pct+'%';rows.innerHTML=d.events.map(e=>'<tr><td>'+e.step+'</td><td>'+e.attack_type+'</td><td>'+e.mutation+'</td><td>'+e.decision+'</td><td>'+e.reason+'</td></tr>').join('');graph.innerHTML=d.events.map((e,i)=>'<div class=node style="left:'+(20+i*150)+'px;top:'+(50+(i%2)*140)+'px">N'+e.step+'<br>'+e.attack_type+'</div>').join('')}render(demo)</script></main>
