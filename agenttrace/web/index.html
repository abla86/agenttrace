<!doctype html><meta charset=utf-8><title>AgentTrace Security Lab</title><style>body{font:16px system-ui;background:#0b1020;color:#eee;margin:0;padding:24px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:18px;background:#17213a;border:1px solid #334363;border-radius:12px}#graph{height:340px;background:#080d19;margin-top:16px;position:relative;border-radius:12px;overflow:hidden}.node{position:absolute;padding:10px;border:1px solid #e06c75;border-radius:8px;background:#202c48}table{width:100%;margin-top:16px;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334363;text-align:left}</style><main><h1>AgentTrace — Adaptive Agent Security Lab</h1><p>Bounded attack simulation and policy evidence.</p><div class=grid><div class=card><b id=t>0</b><br>scenarios</div><div class=card><b id=b>0</b><br>blocked</div><div class=card><b id=a>0</b><br>allowed</div><div class=card><b id=r>—</b><br>Merkle root</div></div><input id=f type=file accept=.json><div id=graph></div><table><thead><tr><th>Step</th><th>Attack</th><th>Mutation</th><th>Decision</th><th>Reason</th></tr></thead><tbody id=rows></tbody></table><script>function render(d){t.textContent=d.total;b.textContent=d.blocked;a.textContent=d.total-d.blocked;r.textContent=(d.baseline_merkle_root||'—').slice(0,12);rows.innerHTML=d.events.map(e=>'<tr><td>'+e.step+'</td><td>'+e.attack_type+'</td><td>'+e.mutation+'</td><td>'+(e.allowed?'ALLOW':'BLOCK')+'</td><td>'+e.reason+'</td></tr>').join('');graph.innerHTML=d.events.map((e,i)=>'<div class=node style="left:'+(20+i*120)+'px;top:'+(50+(i%2)*150)+'px">N'+e.step+'<br>'+e.attack_type+'</div>').join('')}f.onchange=async e=>render(JSON.parse(await e.target.files[0].text()));render({total:5,blocked:4,baseline_merkle_root:'demo',events:[{step:1,attack_type:'INDIRECT_INJECTION',mutation:'multi_step',allowed:false,reason:'UNTRUSTED_AUTHORITY'},{step:2,attack_type:'TOOL_POISONING',mutation:'tool_drift',allowed:false,reason:'TOOL_INTEGRITY_DRIFT'},{step:3,attack_type:'PRIVILEGE_ESCALATION',mutation:'role_shift',allowed:false,reason:'PHASE_CAPABILITY_DENIED'},{step:4,attack_type:'SECRET_EXFILTRATION',mutation:'direct',allowed:false,reason:'SECRET_NETWORK_FLOW'},{step:5,attack_type:'INDIRECT_INJECTION',mutation:'direct',allowed:true,reason:'AUTHORIZED'}]})</script></main>
