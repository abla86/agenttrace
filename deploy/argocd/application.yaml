apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agenttrace
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/abla86/agenttrace.git
    targetRevision: master
    path: charts/agenttrace
    helm:
      releaseName: agenttrace
  destination:
    server: https://kubernetes.default.svc
    namespace: agenttrace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
