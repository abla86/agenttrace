name: Security / Kubernetes / Enterprise

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  python-security:
    name: Python security and integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q agenttrace promptguard core_integration tests

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Bandit
        run: bandit -q -r agenttrace promptguard core_integration -x tests

      - name: Dependency audit
        run: pip-audit

  helm-security:
    name: Helm and Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint Helm chart
        run: helm lint charts/agenttrace --namespace agenttrace

      - name: Render Helm chart
        run: helm template agenttrace charts/agenttrace --namespace agenttrace --values charts/agenttrace/values.yaml > /tmp/agenttrace-rendered.yaml

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tgz
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate rendered manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.35.0 \
            /tmp/agenttrace-rendered.yaml

      - name: Validate static security manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.35.0 \
            security/*.yaml

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agenttrace:ci
