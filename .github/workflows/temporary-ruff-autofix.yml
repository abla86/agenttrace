name: Temporary Ruff Autofix

on:
  push:
    branches: [chore/agenttrace-ruff-autofix]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: github.ref_name == 'chore/agenttrace-ruff-autofix'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Apply safe automatic lint fixes
        run: ruff check --fix .
      - name: Commit fixes if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No automatic fixes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply safe Ruff auto-fixes [skip ci]"
          git push
