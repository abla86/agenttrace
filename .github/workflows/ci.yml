name: CI / Deterministic Test Suite

on:
  push:
    branches: [ "master", "security-validation" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Test & Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Compile Python Sources
        run: python -m compileall -q agenttrace promptguard tests

      - name: Run Deterministic Pytest Suite
        run: pytest -v tests/

      - name: Dependency Audit
        run: |
          python -m pip install pip-audit
          pip-audit

      - name: Static Security Audit
        run: |
          python -m pip install bandit
          bandit -q -r agenttrace promptguard -x tests

  kubernetes-manifests:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: -strict -summary /github/workspace/security/*.yaml
