name: CI / Deterministic Test Suite

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Audit (Python ${{ matrix.python-version }})
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Project
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e ".[dev]"

      - name: Verify installed package metadata
        run: python -m pip check

      - name: Lint with Ruff
        run: ruff check .

      - name: Compile Python Sources
        run: python -m compileall -q agenttrace promptguard tests

      - name: Run Deterministic Pytest Suite
        run: pytest -v tests/

      - name: Dependency Audit
        run: |
          python -m pip install pip-audit
          pip-audit

      - name: Static Security Audit
        run: |
          python -m pip install bandit
          bandit -q -ll -r agenttrace promptguard -x tests
