name: Ruff Autofix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ruff-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff

      - name: Apply safe lint fixes and formatting
        run: |
          ruff check --fix .
          ruff format .

      - name: Create pull request with verified auto-fixes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ruff-autofix
          delete-branch: true
          title: "fix: apply Ruff lint and formatting corrections"
          commit-message: "fix: apply safe Ruff autofixes"
          body: |
            Applies Ruff's safe automatic lint fixes and standard formatting.
            CI must pass before merging. No unsafe fixes are applied.
          labels: automated-fix
