name: Ruff Lint Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff

      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .
