apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenttrace-policy-server
  namespace: agenttrace
spec:
  podSelector:
    matchLabels:
      app: agenttrace-policy-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agenttrace-dashboard
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: vault
      ports:
        - protocol: TCP
          port: 8200
