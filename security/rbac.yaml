apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-engine-role
  namespace: agenttrace
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-engine-rolebinding
  namespace: agenttrace
subjects:
  - kind: ServiceAccount
    name: agenttrace-alert-engine-sa
    namespace: agenttrace
roleRef:
  kind: Role
  name: alert-engine-role
  apiGroup: rbac.authorization.k8s.io
