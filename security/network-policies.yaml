apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenttrace-default-deny
  namespace: agenttrace
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenttrace-dns-egress
  namespace: agenttrace
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenttrace-policy-server
  namespace: agenttrace
spec:
  podSelector:
    matchLabels:
      app: agenttrace-policy-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agenttrace-dashboard
        - podSelector:
            matchLabels:
              app: agenttrace-otel-collector
        - podSelector:
            matchLabels:
              app: agenttrace-alert-engine
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - podSelector:
            matchLabels:
              app: agenttrace-dashboard
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: agenttrace-otel-collector
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: agenttrace-alert-engine
      ports:
        - protocol: TCP
          port: 9100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenttrace-dashboard
  namespace: agenttrace
spec:
  podSelector:
    matchLabels:
      app: agenttrace-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: agenttrace-policy-server
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenttrace-otel-collector
  namespace: agenttrace
spec:
  podSelector:
    matchLabels:
      app: agenttrace-otel-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: agenttrace-policy-server
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenttrace-alert-engine
  namespace: agenttrace
spec:
  podSelector:
    matchLabels:
      app: agenttrace-alert-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 9100
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: agenttrace-policy-server
      ports:
        - protocol: TCP
          port: 8000
