[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "1.0.1"
description = "Deterministic provenance, execution tracing, policy and security primitives for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "abla86"}]
dependencies = ["starlette>=0.36.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4.1", "ruff>=0.3", "mypy>=1.8"]

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.setuptools.packages.find]
include = ["agenttrace*", "promptguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
