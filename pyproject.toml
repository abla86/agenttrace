[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "1.0.0"
description = "Deterministic provenance, policy evaluation, audit tracing, and action gateway for AI agents"
readme = "README.md"
authors = [{ name = "abla86" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/abla86/agenttrace"
Repository = "https://github.com/abla86/agenttrace"
Issues = "https://github.com/abla86/agenttrace/issues"

[project.scripts]
agenttrace = "agenttrace.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "starlette>=0.36.0",
]
web = [
    "starlette>=0.36.0",
    "uvicorn>=0.30.0",
]
warroom = [
    "streamlit>=1.32.0",
    "uvicorn>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["agenttrace*", "promptguard*"]

[tool.setuptools.package-data]
agenttrace = ["py.typed"]
promptguard = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]
